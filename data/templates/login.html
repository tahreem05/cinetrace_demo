{% extends "base.html" %}
{% block title %}Login — CineTrace{% endblock %}

{% block head %}
<style>
.login-container{max-width:400px;margin:80px auto;background:var(--surface2);padding:40px;border-radius:8px;border:1px solid var(--border);box-shadow:0 15px 35px rgba(0,0,0,0.5)}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1.5px;color:var(--text);margin-bottom:25px;text-align:center}
.login-form{display:flex;flex-direction:column;gap:15px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.form-input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 15px;border-radius:4px;font-family:inherit;font-size:14px;outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--gold)}
.login-btn{background:var(--gold);color:#000;border:none;padding:12px;border-radius:4px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px;transition:background 0.2s}
.login-btn:hover{background:var(--gold2)}
.login-error{background:var(--red);color:white;padding:10px;border-radius:4px;font-size:13px;text-align:center;margin-bottom:15px}
.test-creds{margin-top:20px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <h2 class="login-title">Sign In</h2>
    
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    
    <form class="login-form" method="POST" action="/login">
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-input" required placeholder="name@example.com" value="cinephile@example.com">
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-input" required placeholder="••••••••" value="password">
        </div>
        <button type="submit" class="login-btn">Sign In</button>
    </form>
    
    <div class="test-creds">
        <strong>Test Accounts:</strong><br>
        Admin: admin@cinetrace.com / password<br>
        User: cinephile@example.com / password
    </div>
</div>
{% endblock %}
