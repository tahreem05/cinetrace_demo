<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>{% block title %}CineTrace{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0a0a0f;
      --surface:#111118;
      --surface2:#18181f;
      --border:#ffffff0f;
      --gold:#e8b84b;
      --gold2:#f5d07a;
      --red:#e53935;
      --text:#f0eff5;
      --muted:#7c7c8a;
      --card-radius:6px;
      --nav-h:64px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;min-height:100vh;overflow-x:hidden}

    /* ── NAV ── */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:100;
      height:var(--nav-h);display:flex;align-items:center;
      padding:0 40px;gap:32px;
      background:linear-gradient(to bottom,#000000cc,transparent);
      backdrop-filter:blur(0px);
      transition:background .3s,backdrop-filter .3s;
    }
    nav.scrolled{background:#0a0a0fef;backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .nav-logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--gold);text-decoration:none;flex-shrink:0}
    .nav-logo span{color:var(--text)}
    .nav-links{display:flex;gap:24px;flex:1}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;letter-spacing:.5px;transition:color .2s}
    .nav-links a:hover,.nav-links a.active{color:var(--text)}
    .nav-search{position:relative;margin-left:auto}
    .nav-search input{
      background:var(--surface2);border:1px solid var(--border);color:var(--text);
      padding:8px 16px 8px 40px;border-radius:24px;width:220px;font-family:inherit;font-size:13px;
      transition:width .3s,border-color .3s;outline:none;
    }
    .nav-search input:focus{width:300px;border-color:var(--gold)}
    .nav-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}
    #search-results{
      position:absolute;top:calc(100% + 8px);right:0;width:340px;
      background:var(--surface2);border:1px solid var(--border);border-radius:8px;
      overflow:hidden;display:none;box-shadow:0 20px 60px #00000088;z-index:200;
    }
    .sr-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;text-decoration:none;color:inherit;transition:background .15s}
    .sr-item:hover{background:var(--border)}
    .sr-poster{width:36px;height:52px;border-radius:3px;object-fit:cover;background:var(--surface);flex-shrink:0}
    .sr-info{overflow:hidden}
    .sr-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sr-meta{font-size:11px;color:var(--muted)}

    /* ── MAIN ── */
    main{padding-top:var(--nav-h)}

    /* ── HERO ── */
    .hero{
      position:relative;height:82vh;min-height:500px;display:flex;align-items:flex-end;
      padding:0 60px 80px;overflow:hidden;
    }
    .hero-bg{
      position:absolute;inset:0;background-size:cover;background-position:center top;
      filter:brightness(.45) saturate(1.1);
    }
    .hero-fade{
      position:absolute;inset:0;
      background:linear-gradient(to right,#0a0a0fee 20%,transparent 65%),
                 linear-gradient(to top,#0a0a0f 0%,transparent 50%);
    }
    .hero-content{position:relative;z-index:1;max-width:560px}
    .hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#000;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:4px 10px;border-radius:3px;margin-bottom:16px;text-transform:uppercase}
    .hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(42px,7vw,82px);line-height:.95;letter-spacing:2px;margin-bottom:14px}
    .hero-meta{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted);margin-bottom:20px}
    .hero-rating{display:flex;align-items:center;gap:5px;color:var(--gold);font-weight:700;font-size:16px}
    .hero-desc{font-size:14px;line-height:1.7;color:#ccccdd;max-width:420px;margin-bottom:28px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .hero-genres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px}
    .genre-tag{background:var(--border);border:1px solid #ffffff15;padding:4px 12px;border-radius:20px;font-size:12px;color:var(--muted)}
    .btn-primary{
      display:inline-flex;align-items:center;gap:8px;
      background:var(--gold);color:#000;font-weight:700;font-size:14px;letter-spacing:.5px;
      padding:12px 28px;border-radius:4px;text-decoration:none;border:none;cursor:pointer;
      transition:background .2s,transform .15s;
    }
    .btn-primary:hover{background:var(--gold2);transform:translateY(-1px)}
    .btn-outline{
      display:inline-flex;align-items:center;gap:8px;
      background:transparent;color:var(--text);font-weight:600;font-size:14px;
      padding:11px 24px;border-radius:4px;text-decoration:none;border:1px solid #ffffff30;
      transition:border-color .2s,background .2s;
    }
    .btn-outline:hover{background:#ffffff15;border-color:#ffffff55}
    .hero-actions{display:flex;gap:12px}

    /* ── ROW SECTIONS ── */
    .section{padding:0 40px 48px}
    .section-header{display:flex;align-items:baseline;gap:16px;margin-bottom:20px}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--text)}
    .section-count{font-size:12px;color:var(--muted)}
    .section-link{margin-left:auto;font-size:13px;color:var(--gold);text-decoration:none;transition:opacity .2s}
    .section-link:hover{opacity:.75}

    /* ── FILM CARDS (scroll row) ── */
    .film-row{
      display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;
      scrollbar-width:thin;scrollbar-color:var(--border) transparent;
    }
    .film-row::-webkit-scrollbar{height:4px}
    .film-row::-webkit-scrollbar-track{background:transparent}
    .film-row::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    .film-card{
      flex-shrink:0;width:155px;cursor:pointer;
      transition:transform .25s ease;
    }
    .film-card:hover{transform:scale(1.06) translateY(-4px);z-index:2}
    .film-card:hover .card-overlay{opacity:1}
    .card-poster-wrap{position:relative;border-radius:var(--card-radius);overflow:hidden;aspect-ratio:2/3;background:var(--surface2)}
    .card-poster{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s}
    .card-overlay{
      position:absolute;inset:0;
      background:linear-gradient(to top,#000000dd 30%,transparent);
      opacity:0;transition:opacity .25s;
      display:flex;flex-direction:column;justify-content:flex-end;padding:12px;
    }
    .card-play{width:36px;height:36px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
    .card-genre-tags{display:flex;flex-wrap:wrap;gap:4px}
    .card-genre-tag{font-size:9px;background:#ffffff22;padding:2px 6px;border-radius:3px;color:#ddd}
    .card-rating-badge{
      position:absolute;top:8px;right:8px;
      background:#000000bb;border:1px solid var(--gold);
      color:var(--gold);font-size:11px;font-weight:700;
      padding:2px 6px;border-radius:3px;backdrop-filter:blur(4px);
    }
    .card-info{padding:8px 2px 0}
    .card-title{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
    .card-meta .dot{opacity:.4}

    /* ── FILM GRID (browse) ── */
    .film-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:20px;
    }

    /* ── STATS BAR ── */
    .stats-bar{
      display:flex;gap:0;margin:0 40px 48px;
      border:1px solid var(--border);border-radius:8px;overflow:hidden;
    }
    .stat-block{flex:1;padding:24px;border-right:1px solid var(--border);text-align:center}
    .stat-block:last-child{border-right:none}
    .stat-num{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;color:var(--gold)}
    .stat-label{font-size:12px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:2px}

    /* ── FOOTER ── */
    footer{background:var(--surface);border-top:1px solid var(--border);padding:32px 40px;margin-top:40px;display:flex;align-items:center;gap:20px}
    .footer-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--gold)}
    .footer-text{font-size:13px;color:var(--muted);margin-left:auto}

    /* ── UTILITIES ── */
    .star{color:var(--gold);font-size:13px}
    .no-data{padding:60px;text-align:center;color:var(--muted)}
    a{color:inherit;text-decoration:none}

    /* ── QUICK VIEW MODAL ── */
    .modal-overlay{position:fixed;inset:0;background:#000000dd;z-index:999;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px)}
    .modal-overlay.active{display:flex}
    .modal-content{background:var(--surface);width:100%;max-width:850px;max-height:90vh;border-radius:8px;overflow-y:auto;position:relative;box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);border:1px solid var(--border);animation:modalFade 0.3s ease}
    @keyframes modalFade{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
    .modal-close{position:absolute;top:15px;right:15px;background:rgba(0,0,0,0.6);color:white;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;transition:background 0.2s}
    .modal-close:hover{background:var(--red)}
    .modal-hero{position:relative;height:350px;display:flex;align-items:flex-end;padding:30px}
    .modal-hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:brightness(0.35) saturate(1.2)}
    .modal-hero-fade{position:absolute;inset:0;background:linear-gradient(to top,#111118 0%,transparent 80%)}
    .modal-body{padding:0 30px 30px}
    .modal-title{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:1px;margin-bottom:8px;position:relative;z-index:2;line-height:1}
    .modal-meta{display:flex;gap:12px;font-size:13px;color:var(--muted);margin-bottom:20px;position:relative;z-index:2;font-weight:500}
    .modal-meta span{color:var(--text)}
    .modal-synopsis{font-size:14px;line-height:1.6;color:#ccc;margin-bottom:30px}
    .modal-section-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--gold);margin-bottom:15px;text-transform:uppercase}
    .inspired-row{display:flex;gap:15px;overflow-x:auto;padding-bottom:15px;scrollbar-width:none}
    .inspired-row::-webkit-scrollbar{display:none}
    .inspired-card{flex:0 0 130px;text-align:center;text-decoration:none;transition:transform 0.2s;cursor:pointer}
    .inspired-card:hover{transform:scale(1.05)}
    .inspired-poster{width:130px;height:195px;border-radius:4px;object-fit:cover;margin-bottom:8px;background:var(--surface2)}
    .inspired-title{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .inspired-type{font-size:10px;color:var(--muted);text-transform:uppercase}

    @media(max-width:768px){
      nav{padding:0 20px}
      .hero{padding:0 20px 60px}
      .section,.stats-bar{padding-left:20px;padding-right:20px}
      .stats-bar{margin:0 20px 32px}
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav id="mainNav">
  <a class="nav-logo" href="/"><span>CINE</span>TRACE</a>
  <div class="nav-links">
    <a href="/" class="{% if request.path=='/' %}active{% endif %}">Home</a>
    <a href="/browse" class="{% if request.path=='/browse' %}active{% endif %}">Browse</a>
    <a href="/directors" class="{% if request.path=='/directors' %}active{% endif %}">Directors</a>
  </div>
  <div class="nav-search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search films, directors…" autocomplete="off"/>
    <div id="search-results"></div>
  </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<footer>
  <span class="footer-logo">CINETRACE</span>
  <span class="footer-text">Mapping cinematic influence since 2024</span>
</footer>

<!-- QUICK VIEW MODAL -->
<div class="modal-overlay" id="quickModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="modal-hero">
      <div class="modal-hero-bg" id="modalHeroBg"></div>
      <div class="modal-hero-fade"></div>
      <div style="position:relative;z-index:2;width:100%">
        <h2 class="modal-title" id="modalTitle">Loading...</h2>
        <div class="modal-meta" id="modalMeta"></div>
        <div style="margin-bottom:20px">
          <a href="#" id="modalDetailBtn" class="btn-primary" style="padding:10px 24px">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
            Full Details
          </a>
        </div>
      </div>
    </div>
    <div class="modal-body">
      <p class="modal-synopsis" id="modalSynopsis"></p>
      
      <div id="modalInspiredByContainer" style="display:none;margin-bottom:30px">
        <h3 class="modal-section-title">Inspired By</h3>
        <div class="inspired-row" id="modalInspiredBy"></div>
      </div>

      <div id="modalInfluencedContainer" style="display:none">
        <h3 class="modal-section-title">Films It Influenced</h3>
        <div class="inspired-row" id="modalInfluenced"></div>
      </div>
    </div>
  </div>
</div>

<script>
const GLOBAL_TMDB_KEY = "{{ TMDB_API_KEY }}";

// Nav scroll effect
window.addEventListener('scroll',()=>{
  document.getElementById('mainNav').classList.toggle('scrolled',scrollY>40)
})

// Live search
const inp=document.getElementById('searchInput')
const box=document.getElementById('search-results')
let debounce
inp.addEventListener('input',()=>{
  clearTimeout(debounce)
  const q=inp.value.trim()
  if(!q){box.style.display='none';return}
  debounce=setTimeout(()=>{
    fetch('/api/search?q='+encodeURIComponent(q))
      .then(r=>r.json()).then(films=>{
        if(!films.length){box.style.display='none';return}
        box.innerHTML=films.map(f=>`
          <a class="sr-item" href="/film/${f.film_id}">
            <img class="sr-poster" src="${posterUrl(f.title,f.release_year)}" 
                 onerror="this.src='/static/img/placeholder.svg'" alt="">
            <div class="sr-info">
              <div class="sr-title">${f.title}</div>
              <div class="sr-meta">${f.release_year||''} · ${f.director_name||''}</div>
            </div>
          </a>`).join('')
        box.style.display='block'
      })
  },250)
})
document.addEventListener('click',e=>{if(!e.target.closest('.nav-search'))box.style.display='none'})

// TMDB Poster Cache
const posterCache = new Map();

async function getPosterUrl(title, year) {
  if (!GLOBAL_TMDB_KEY) return '/static/img/placeholder.svg';
  const cacheKey = `${title}`;
  if (posterCache.has(cacheKey)) return posterCache.get(cacheKey);

  try {
    const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${GLOBAL_TMDB_KEY}&query=${encodeURIComponent(title)}`);
    const data = await res.json();
    const p = data.results?.[0]?.poster_path;
    const url = p ? `https://image.tmdb.org/t/p/w500${p}` : '/static/img/placeholder.svg';
    posterCache.set(cacheKey, url);
    return url;
  } catch {
    return '/static/img/placeholder.svg';
  }
}

async function getBackdropUrl(title, year) {
  if (!GLOBAL_TMDB_KEY) return '/static/img/hero_placeholder.svg';
  const cacheKey = `bg_${title}`;
  if (posterCache.has(cacheKey)) return posterCache.get(cacheKey);

  try {
    const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${GLOBAL_TMDB_KEY}&query=${encodeURIComponent(title)}`);
    const data = await res.json();
    const p = data.results?.[0]?.backdrop_path;
    const url = p ? `https://image.tmdb.org/t/p/w1280${p}` : '/static/img/hero_placeholder.svg';
    posterCache.set(cacheKey, url);
    return url;
  } catch {
    return '/static/img/hero_placeholder.svg';
  }
}

function posterUrl(title,year){
  // For sync returns like in search box, return placeholder and lazy load if needed.
  return '/static/img/placeholder.svg'
}

// Modal Logic
function openModal(filmId, title, year) {
  const modal = document.getElementById('quickModal');
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
  
  // reset
  document.getElementById('modalTitle').textContent = title || 'Loading...';
  document.getElementById('modalMeta').innerHTML = '';
  document.getElementById('modalSynopsis').textContent = '';
  document.getElementById('modalHeroBg').style.backgroundImage = 'none';
  document.getElementById('modalDetailBtn').href = `/film/${filmId}`;
  document.getElementById('modalInspiredByContainer').style.display = 'none';
  document.getElementById('modalInfluencedContainer').style.display = 'none';

  // fetch TMDB backdrop
  if(title) {
    getBackdropUrl(title, year).then(url => {
        document.getElementById('modalHeroBg').style.backgroundImage = `url('${url}')`;
    });
  }

  // fetch data from app API
  fetch(`/api/film_details/${filmId}`)
    .then(r => r.json())
    .then(data => {
      const f = data.film;
      document.getElementById('modalTitle').textContent = f.title;
      document.getElementById('modalMeta').innerHTML = `
        <span>★ ${f.avg_rating || 'N/A'}</span>
        <span>${f.release_year || ''}</span>
        <span>${f.runtime_min ? f.runtime_min+'m' : ''}</span>
        <span>${f.director_name || ''}</span>
      `;
      document.getElementById('modalSynopsis').textContent = f.synopsis || '';
      
      const inflBy = data.influences.influenced_by;
      if (inflBy && inflBy.length > 0) {
        document.getElementById('modalInspiredByContainer').style.display = 'block';
        const container = document.getElementById('modalInspiredBy');
        container.innerHTML = inflBy.map(link => `
          <a class="inspired-card" href="javascript:void(0)" onclick="openModal('${link.source_film_id}', '${link.film_title.replace(/'/g,"\\'")}')">
            <img class="inspired-poster" data-lazy-title="${link.film_title}" src="/static/img/placeholder.svg" alt=""/>
            <div class="inspired-title">${link.film_title}</div>
            <div class="inspired-type">${link.influence_type.replace('_', ' ')}</div>
          </a>
        `).join('');
        loadLazyPosters(container);
      }

      const inflOut = data.influences.influenced;
      if (inflOut && inflOut.length > 0) {
        document.getElementById('modalInfluencedContainer').style.display = 'block';
        const container = document.getElementById('modalInfluenced');
        container.innerHTML = inflOut.map(link => `
          <a class="inspired-card" href="javascript:void(0)" onclick="openModal('${link.target_film_id || link.influenced_film_id}', '${link.film_title.replace(/'/g,"\\'")}')">
            <img class="inspired-poster" data-lazy-title="${link.film_title}" src="/static/img/placeholder.svg" alt=""/>
            <div class="inspired-title">${link.film_title}</div>
            <div class="inspired-type">${link.influence_type.replace('_', ' ')}</div>
          </a>
        `).join('');
        loadLazyPosters(container);
      }
    });
}

function loadLazyPosters(container) {
    container.querySelectorAll('img[data-lazy-title]').forEach(img => {
        getPosterUrl(img.dataset.lazyTitle, '').then(url => img.src = url);
    });
}

function closeModal() {
  document.getElementById('quickModal').classList.remove('active');
  document.body.style.overflow = '';
}

// Close on outside click
document.getElementById('quickModal').addEventListener('click', e => {
  if(e.target === document.getElementById('quickModal')) closeModal();
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
